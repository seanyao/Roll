# Roll rules registry (US-RULE-001 / US-RULE-009) — the single machine-readable
# definition layer for redlines and invariants, native v2 schema parsed strictly
# by packages/spec/src/rules.ts (parseRulesV2; parseRulesRegistry projects v2
# onto the legacy v1 shape for existing doc-drift callers) and audited by
# scripts/audit-rules.mjs (CI gate). Enforcement code is NOT moved here — this
# file only registers where each rule lives and which test proves it is still
# alive. `gates.doc_drift` is the sole authority for the doc-drift gate's
# soft/hard mode; flipping it is a one-line PR here.
version: 2

gates:
  doc_drift: soft

rules:
  - id: RL-TCR-001
    kind: redline
    statement: "Non-docs-only commits must carry a fresh test-pass proof for this cycle"
    owner_domain: guardrails
    severity: block
    enforcement:
      - path: hooks/pre-commit
        marker: "RL-TCR-001"
    verification:
      - path: packages/core/test/tcr.test.ts
        marker: "RL-TCR-001"
    docs:
      - path: docs/architecture.md
        marker: "TCR"
    since: v3.0
  - id: RL-EVID-003
    kind: redline
    statement: "An AC item with zero evidence refs cannot claim pass/readonly/partial — enforceRedLine() forces it down to claimed and surfaces it in the Discrepancies appendix"
    owner_domain: evals
    severity: block
    enforcement:
      - path: packages/core/src/attest/report.ts
        marker: "RL-EVID-003"
    verification:
      - path: packages/core/test/report.test.ts
        marker: "RL-EVID-003"
    docs:
      - path: docs/verification.md
        marker: "evidence"
  - id: RL-FAIL-007
    kind: redline
    statement: "Consecutive failures reaching the pause threshold must auto-PAUSE the loop (PAUSE marker + ALERT + policy:safety_pause event) — no silent self-heal"
    owner_domain: guardrails
    severity: alert
    enforcement:
      - path: packages/cli/src/commands/loop-run-once.ts
        marker: "RL-FAIL-007"
    verification:
      - path: packages/cli/test/loop-run-once.test.ts
        marker: "RL-FAIL-007"
    docs:
      - path: docs/architecture.md
        marker: "PAUSE"
  - id: RL-EVID-004
    kind: redline
    statement: "A card may only be marked Done when the merge is confirmed on main AND acceptance evidence is complete — markDoneGuarded() rejects the transition otherwise, never trusting the caller's claim"
    owner_domain: evals
    severity: block
    enforcement:
      - path: packages/cli/src/runner/done-guard.ts
        marker: "RL-EVID-004"
    verification:
      - path: packages/cli/test/done-guard.test.ts
        marker: "RL-EVID-004"
    docs:
      - path: docs/verification.md
        marker: "证据"
  - id: RL-EVID-005
    kind: redline
    statement: "The acceptance contract is frozen from design truth at cycle start; mid-cycle drift of the worktree contract is detected and surfaced alert-only, never silently honored"
    owner_domain: evals
    severity: alert
    enforcement:
      - path: packages/cli/src/runner/contract-snapshot.ts
        marker: "RL-EVID-005"
    verification:
      - path: packages/cli/test/contract-snapshot.test.ts
        marker: "RL-EVID-005"
    docs:
      - path: docs/acceptance-contract.md
        marker: "frozen"
  - id: RL-ISO-002
    kind: redline
    statement: "The shared main checkout is write-protected during a cycle and dirt/HEAD leaks are quarantined without ever resetting the shared ref; hooks/pre-push refuses direct pushes to main as a CLIENT-SIDE guardrail only — bypassable with --no-verify, never server-side branch protection"
    owner_domain: sandboxing
    severity: block
    enforcement:
      - path: packages/cli/src/runner/main-checkout-guard.ts
        marker: "RL-ISO-002"
      - path: hooks/pre-push
        marker: "RL-ISO-002"
    verification:
      - path: packages/cli/test/main-checkout-guard.test.ts
        marker: "RL-ISO-002"
    docs:
      - path: docs/architecture.md
        marker: "worktree"
  - id: RL-TRUTH-001
    kind: redline
    statement: "Only real merge evidence on main (L1 PR MERGED or L2 patch-id) credits a delivery — backlog Done + attest alone is never sufficient, and with no strong signal the verdict is wait, never a fabricated delivered; the pure core decision and its CLI/infra fact-gathering adapter enforce this jointly"
    owner_domain: observability
    severity: block
    enforcement:
      - path: packages/core/src/delivery/reconcile.ts
        marker: "RL-TRUTH-001"
      - path: packages/cli/src/lib/delivery-facts.ts
        marker: "RL-TRUTH-001"
    verification:
      - path: packages/core/test/delivery-reconcile.test.ts
        marker: "RL-TRUTH-001"
    docs:
      - path: docs/architecture.md
        marker: "事实来源"
  - id: I1
    kind: invariant
    statement: "A running cycle writes a heartbeat at least every 60s; crossing the watchdog threshold forces reaping into a terminal state. Process liveness is orthogonal to business health."
    owner_domain: orchestration
    severity: block
    enforcement:
      - path: packages/cli/src/runner/run-cycle.ts
        marker: "writeHeartbeat"
    verification:
      - path: packages/cli/test/run-cycle.integration.test.ts
        marker: "heartbeatExistedDuringRun"
    docs:
      - path: docs/architecture.md
        marker: "I1"
    projection:
      about:
        en: "A running cycle writes a heartbeat at least every 60s; crossing the watchdog threshold forces reaping into a terminal state. Process liveness is orthogonal to business health."
        zh: "在跑 Cycle 每 ≤60s 写心跳。超 watchdog 阈值必回收并落终态。进程活性 ⟂ 业务健康。"
      verification:
        fault_zh: "停止写心跳，或 watchdog 超阈值仍不回收"
        expected_zh: "超阈值必回收并落终态；心跳存在性由集成测试断言"
      architecture:
        zh: "在跑 Cycle 每 ≤60s 写心跳。超 watchdog 阈值必回收并落终态。进程活性 ⟂ 业务健康。"
  - id: I2
    kind: invariant
    statement: "The process may be SIGKILLed at any time; the next re-entry detects the orphan state and safely takes over. Never depends on graceful exit."
    owner_domain: orchestration
    severity: block
    enforcement:
      - path: packages/core/src/loop/recovery.ts
        marker: "I2"
    verification:
      - path: packages/core/test/orchestrator.test.ts
        marker: "I2"
    docs:
      - path: docs/architecture.md
        marker: "I2"
    projection:
      about:
        en: "The process may be SIGKILLed at any time; the next re-entry detects the orphan state and safely takes over. Never depends on graceful exit."
        zh: "任意时刻进程被 SIGKILL，下次重入检测孤儿态并安全接管。不依赖优雅退出。"
      verification:
        fault_zh: "SIGKILL 后重入把孤儿当活跃，或重复接管同一 Cycle"
        expected_zh: "重入检测孤儿态并安全接管，不依赖优雅退出"
      architecture:
        zh: "任意时刻进程被 SIGKILL，下次重入检测孤儿态并安全接管。不依赖优雅退出。"
  - id: I3
    kind: invariant
    statement: "At most one open PR per story. Dedupe before opening a PR."
    owner_domain: orchestration
    severity: block
    enforcement:
      - path: packages/cli/src/commands/loop-self-downgrade.ts
        marker: "I3"
    verification:
      - path: packages/cli/test/loop-self-downgrade.test.ts
        marker: "I3"
    docs:
      - path: docs/architecture.md
        marker: "I3"
    projection:
      about:
        en: "At most one open PR per story. Dedupe before opening a PR."
        zh: "同一 Story 至多一个 open PR。开 PR 前先查去重。"
      verification:
        fault_zh: "同一 Story 开出第二个 open PR"
        expected_zh: "开 PR 前查重，重复即阻止或降级"
      architecture:
        zh: "同一 Story 至多一个 open PR。开 PR 前先查去重。"
  - id: I4
    kind: invariant
    statement: "The backlog is aspiration, main is truth. Every cycle reconciles — cards marked done but not merged are automatically reverted. Exit code 0 is not delivered; green CI is not delivered."
    owner_domain: truth-consistency
    severity: block
    enforcement:
      - path: packages/core/src/reconcile/engine.ts
        marker: "I4"
    verification:
      - path: packages/core/test/engine.test.ts
        marker: "I4"
    docs:
      - path: docs/architecture.md
        marker: "I4"
    projection:
      about:
        en: "The backlog is aspiration, main is truth. Every cycle reconciles — cards marked done but not merged are automatically reverted. Exit code 0 is not delivered; green CI is not delivered."
        zh: "Backlog 是愿望，main 是真相。每 Cycle 末对账——标了完成但未合并的自动退回。退出码 0 ≠ 已交付，CI 绿 ≠ 已交付。"
      verification:
        fault_zh: "标了 Done 但未合并的卡在 main 对账中存活"
        expected_zh: "未合并自动退回；退出码与 CI 绿均不算交付"
      architecture:
        zh: "Backlog 是愿望，main 是真相。每 Cycle 末对账——标了完成但未合并的自动退回。退出码 0 ≠ 已交付，CI 绿 ≠ 已交付。"
  - id: I5
    kind: invariant
    statement: "One bad story must not freeze other work. N consecutive failures permanently skip the card. No infinite retries relying on manual intervention."
    owner_domain: orchestration
    severity: alert
    enforcement:
      - path: packages/cli/src/runner/skip-cards.ts
        marker: "skip-list"
    verification:
      - path: packages/core/test/picker.test.ts
        marker: "skip-list"
    docs:
      - path: docs/architecture.md
        marker: "I5"
    projection:
      about:
        en: "One bad story must not freeze other work. N consecutive failures permanently skip the card. No infinite retries relying on manual intervention."
        zh: "一个坏 Story 不冻结其他工作。连败 N 次 → 永久暂缓。不靠手动干预无限重试。"
      verification:
        fault_zh: "坏 Story 无限重试，冻结其他工作"
        expected_zh: "连败 N 次进入 skip-list 永久暂缓"
      architecture:
        zh: "一个坏 Story 不冻结其他工作。连败 N 次 → 永久暂缓。不靠手动干预无限重试。"
  - id: I6
    kind: invariant
    statement: "Consecutive failures trigger pause + alert + notification; a human decides. No automatic cross-agent fallback."
    owner_domain: guardrails
    severity: block
    enforcement:
      - path: packages/core/src/loop/orchestrator.ts
        marker: "I6"
    verification:
      - path: packages/core/test/orchestrator.test.ts
        marker: "I6"
    docs:
      - path: docs/architecture.md
        marker: "I6"
    projection:
      about:
        en: "Consecutive failures trigger pause + alert + notification; a human decides. No automatic cross-agent fallback."
        zh: "连续失败 → 暂停 + 告警 + 通知，人决策。不自动跨 agent fallback。"
      verification:
        fault_zh: "连续失败被静默自愈或自动跨 agent fallback"
        expected_zh: "暂停 + 告警 + 通知，人决策"
      architecture:
        zh: "连续失败 → 暂停 + 告警 + 通知，人决策。不自动跨 agent fallback。"
  - id: I7
    kind: invariant
    statement: "Path is identity. All runtime state lives under <project>/.roll/loop/. Parallel projects never pollute each other; no shared mutable state."
    owner_domain: sandboxing
    severity: block
    enforcement:
      - path: packages/spec/src/project.ts
        marker: "I7"
    verification:
      - path: packages/spec/test/project.difftest.test.ts
        marker: "projectSlug"
    docs:
      - path: docs/architecture.md
        marker: "I7"
    projection:
      about:
        en: "Path is identity. All runtime state lives under <project>/.roll/loop/. Parallel projects never pollute each other; no shared mutable state."
        zh: "路径即身份。所有运行态数据放在 `<project>/.roll/loop/`。不同项目并行互不污染，无共享可变状态。"
      verification:
        fault_zh: "运行态数据写到项目外，或跨项目共享可变状态"
        expected_zh: "全部运行态限定在 <project>/.roll/loop/，slug 即身份"
      architecture:
        zh: "路径即身份。所有运行态数据放在 `<project>/.roll/loop/`。不同项目并行互不污染，无共享可变状态。"
  - id: I8
    kind: invariant
    statement: "State is rebuilt from an immutable event stream with no separate cache. Appends are atomic (tmp→rename). Exit always writes a terminal state."
    owner_domain: observability
    severity: block
    enforcement:
      - path: packages/core/src/events/bus.ts
        marker: "I8"
    verification:
      - path: packages/core/test/bus.test.ts
        marker: "I8"
    docs:
      - path: docs/architecture.md
        marker: "I8"
    projection:
      about:
        en: "State is rebuilt from an immutable event stream with no separate cache. Appends are atomic (tmp→rename). Exit always writes a terminal state."
        zh: "状态从不可变事件流重建，无独立缓存。追加原子（tmp→rename）。退出无条件写终态。"
      verification:
        fault_zh: "绕开事件流写独立缓存，或退出不落终态"
        expected_zh: "状态可从事件流重建，追加原子，退出必写终态"
      architecture:
        zh: "状态从不可变事件流重建，无独立缓存。追加原子（tmp→rename）。退出无条件写终态。"
  - id: I9
    kind: invariant
    statement: "Concurrent writers use optimistic locking. Story markers match exactly, never by substring."
    owner_domain: orchestration
    severity: block
    enforcement:
      - path: packages/core/src/backlog/store.ts
        marker: "I9"
    verification:
      - path: packages/core/test/store.test.ts
        marker: "optimistic"
    docs:
      - path: docs/architecture.md
        marker: "I9"
    projection:
      about:
        en: "Concurrent writers use optimistic locking. Story markers match exactly, never by substring."
        zh: "多写并发用乐观锁。标记 Story 精确匹配，不用子串。"
      verification:
        fault_zh: "并发写互相覆盖，或用子串匹配误标 Story"
        expected_zh: "乐观锁拒绝陈旧写，标记精确匹配"
      architecture:
        zh: "多写并发用乐观锁。标记 Story 精确匹配，不用子串。"
  - id: I10
    kind: invariant
    statement: "Routing follows predictable rules (task level/type). A seconds-level liveness probe runs before spawn. Same input routes identically."
    owner_domain: orchestration
    severity: alert
    enforcement:
      - path: packages/core/src/agent/router.ts
        marker: "I10"
    verification:
      - path: packages/cli/test/cast.test.ts
        marker: "I10"
    docs:
      - path: docs/architecture.md
        marker: "I10"
    projection:
      about:
        en: "Routing follows predictable rules (task level/type). A seconds-level liveness probe runs before spawn. Same input routes identically."
        zh: "按可预测规则路由（任务层级/类型）。spawn 前秒级探活。同输入路由恒定。"
      verification:
        fault_zh: "同输入路由到不同 agent，或 spawn 前不探活"
        expected_zh: "路由恒定，spawn 前秒级探活"
      architecture:
        zh: "按可预测规则路由（任务层级/类型）。spawn 前秒级探活。同输入路由恒定。"
  - id: I11
    kind: invariant
    statement: "Every cycle records (agent, model, tokens, cost, retry count, effective cost). Approaching the budget ceiling triggers downgrade or pause with notification. Effective cost includes retries."
    owner_domain: observability
    severity: alert
    enforcement:
      - path: packages/core/src/cost/tracker.ts
        marker: "I11"
    verification:
      - path: packages/core/test/tracker.test.ts
        marker: "effectiveCost"
    docs:
      - path: docs/architecture.md
        marker: "I11"
    projection:
      about:
        en: "Every cycle records (agent, model, tokens, cost, retry count, effective cost). Approaching the budget ceiling triggers downgrade or pause with notification. Effective cost includes retries."
        zh: "每 Cycle 记录 `(agent, model, token, cost, 回退次数, 有效成本)`。逼近预算上限 → 降级或暂停并通知。有效成本含回退。"
      verification:
        fault_zh: "成本记录漏回退次数，或超预算不降级不通知"
        expected_zh: "有效成本含回退，逼近上限降级或暂停并通知"
      architecture:
        zh: "每 Cycle 记录 `(agent, model, token, cost, 回退次数, 有效成本)`。逼近预算上限 → 降级或暂停并通知。有效成本含回退。"
  - id: I12
    kind: invariant
    statement: "One cycle, one story, fresh context, TCR green-or-revert at every step. Zero TCR commits means the cycle is judged failed and alerts."
    owner_domain: evals
    severity: block
    enforcement:
      - path: packages/core/src/delivery/tcr.ts
        marker: "I12"
    verification:
      - path: packages/core/test/tcr.test.ts
        marker: "I12"
    docs:
      - path: docs/architecture.md
        marker: "I12"
    projection:
      about:
        en: "One cycle, one story, fresh context, TCR green-or-revert at every step. Zero TCR commits means the cycle is judged failed and alerts."
        zh: "一 Cycle 一个 Story，全新上下文，TCR 每步 green-or-revert。0 个 TCR 提交 → 判定失败并告警。"
      verification:
        fault_zh: "一 Cycle 塞多个 Story，或 0 个 TCR 提交仍判成功"
        expected_zh: "一 Cycle 一 Story，0 个 TCR 提交判失败并告警"
      architecture:
        zh: "一 Cycle 一个 Story，全新上下文，TCR 每步 green-or-revert。0 个 TCR 提交 → 判定失败并告警。"

pipeline_stages: []

doc_surfaces:
  - id: DS-ATTEST
    paths:
      - "packages/core/src/attest/**"
      - "packages/cli/src/runner/attest-gate.ts"
    docs:
      - "docs/verification.md"
      - "docs/maps/attest.md"
      - "guide/en/acceptance-evidence.md"
      - "guide/zh/acceptance-evidence.md"
