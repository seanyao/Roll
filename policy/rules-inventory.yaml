    reviewed_by: US-RULE-009
  - path: packages/core/src/attest/report.ts
    marker: "RL-EVID-003"
    classification: registered
    rule_id: RL-EVID-003
    reason: "zero-evidence AC downgrade"
    reviewed_by: US-RULE-009
  - path: packages/core/src/backlog/store.ts
    marker: "I9"
    classification: registered
    rule_id: I9
    reason: "optimistic-locking backlog store"
    reviewed_by: US-RULE-009
  - path: packages/core/src/cost/tracker.ts
    marker: "I11"
    classification: registered
